[package]
name = "listen-web"
description = "Listen & Learn: the thin browser layer (DOM, Web Audio, pointer events)"
edition.workspace = true
version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
listen-core = { path = "../listen-core" }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"

[dependencies.web-sys]
version = "0.3.106"
features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "Node", "NodeList",
  "Event", "EventTarget", "PointerEvent", "MouseEvent", "KeyboardEvent", "AddEventListenerOptions",
  "Location", "Storage", "DomTokenList", "DomRect", "Navigator", "Performance", "MediaQueryList",
  "AudioContext", "AudioContextState", "BaseAudioContext", "AudioNode", "AudioParam", "GainNode",
  "OscillatorNode", "AudioScheduledSourceNode", "BiquadFilterNode", "BiquadFilterType",
  "DynamicsCompressorNode", "AudioDestinationNode", "AudioBuffer", "AudioBufferSourceNode",
  "SpeechSynthesis", "SpeechSynthesisUtterance", "HtmlAudioElement", "HtmlMediaElement",
]
