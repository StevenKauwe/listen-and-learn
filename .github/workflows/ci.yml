# Checks every push and pull request; on main, builds the wasm site and
# deploys it to GitHub Pages. Actions are pinned to commit SHAs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No extra CPU features: iPhone WebKit rejects relaxed SIMD.
  RUSTFLAGS: ""
  BINARYEN_VERSION: "133"

jobs:
  check:
    name: fmt, clippy (native + wasm32), tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: check
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p listen-web --locked --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace --locked

  web:
    name: wasm build, relaxed-SIMD check, size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: web
      - name: wasm-bindgen version from Cargo.lock
        id: wb
        run: echo "version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/[^0-9.]/, ""); print; exit }' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: wasm-bindgen@${{ steps.wb.outputs.version }},wasm-tools
      - name: Install wasm-opt (binaryen ${{ env.BINARYEN_VERSION }})
        run: |
          url="https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl -fsSL "$url" -o binaryen.tgz
          curl -fsSL "$url.sha256" -o binaryen.tgz.sha256
          echo "$(awk '{print $1}' binaryen.tgz.sha256)  binaryen.tgz" | sha256sum -c -
          tar -xzf binaryen.tgz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
          rm binaryen.tgz binaryen.tgz.sha256
      - run: tools/build.sh
      - name: No relaxed SIMD (iPhone WebKit rejects it)
        run: wasm-tools validate --features=-relaxed-simd dist/listen_web_bg.wasm
      - name: Size report
        run: |
          {
            echo "### Web build size"
            echo "| File | Bytes | gzip bytes |"
            echo "|---|---:|---:|"
            for f in dist/index.html dist/listen_web.js dist/listen_web_bg.wasm; do
              echo "| \`$f\` | $(stat -c %s "$f") | $(gzip -9 -c "$f" | wc -c) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Site folder (without the artifact copy)
        run: rm -rf dist/artifact
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: deploy to GitHub Pages
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [check, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
