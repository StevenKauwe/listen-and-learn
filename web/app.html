<title>Listen &amp; Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: a nursery wall; every control is a painted wooden toy with real depth.
   Portrait stacks top bar / Listen / answers; landscape puts Listen beside the answers. */
:root {
  --wall: #D6E7E2; --wall-dot: #C5DCD5; --fg: #3A2E35; --fg-soft: #6E6068;
  --wood: #D9A46A; --wood-hi: #EECB98; --wood-side: #A06A3A;
  --cream: #FFF8EC; --ink: #2E2630; --shadow: rgba(46, 38, 48, .18);
  --sheet: #FFFDF8; --sheet-fg: #3A2E35; --line: #E7DED5; --accent: #3E7FD6; --chip: #F1EAE2;
  --scrim: rgba(30, 24, 34, .45); --toy-filter: none;
  --do: #E5493A; --re: #F28A2E; --mi: #F4C430; --fa: #55AD4F; --sol: #3E7FD6; --la: #8C5BC8; --ti: #EC74A9;
  --t-notes: #FFD9BD; --t-birdfish: #BFE3F2; --t-twins: #FBE7A1; --t-stairs: #D3E8BC;
  --t-echo: #DCCFF2; --t-tempo: #F8D0C8; --t-loud: #CFDAE8; --t-play: #EFD3A8;
  --t-who: #F6D6E6; --t-drum: #F3C9A6;
  --sky-1: #93CDEB; --sky-2: #DDF1FA; --sea-1: #4A9AD0; --sea-2: #2A679E;
  --font-display: "Grandstander", "Fredoka", "Arial Rounded MT Bold", ui-rounded, system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --wall: #1E2637; --wall-dot: #253048; --fg: #F3EADF; --fg-soft: #B9AFA8;
  --wood: #B98654; --wood-hi: #D3A676; --wood-side: #73492A; --shadow: rgba(0, 0, 0, .42);
  --sheet: #273045; --sheet-fg: #F3EADF; --line: #3A4560; --accent: #86B6F2; --chip: #33405A;
  --scrim: rgba(0, 0, 0, .55); --toy-filter: brightness(.9) saturate(.95);
  --sky-1: #6FA9CB; --sky-2: #A9CFE2; --sea-1: #2F78AE; --sea-2: #1C4C7A; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --wall: #1E2637; --wall-dot: #253048; --fg: #F3EADF; --fg-soft: #B9AFA8;
  --wood: #B98654; --wood-hi: #D3A676; --wood-side: #73492A; --shadow: rgba(0, 0, 0, .42);
  --sheet: #273045; --sheet-fg: #F3EADF; --line: #3A4560; --accent: #86B6F2; --chip: #33405A;
  --scrim: rgba(0, 0, 0, .55); --toy-filter: brightness(.9) saturate(.95);
  --sky-1: #6FA9CB; --sky-2: #A9CFE2; --sea-1: #2F78AE; --sea-2: #1C4C7A; color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; }
body {
  margin: 0; color: var(--fg); font-family: var(--font-body);
  background-color: var(--wall);
  background-image: radial-gradient(var(--wall-dot) 2.2px, transparent 2.6px);
  background-size: 26px 26px;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; border: 0; padding: 0; background: none; cursor: pointer; touch-action: none; }
:focus-visible { outline: 4px solid var(--accent); outline-offset: 4px; }
.k { stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }

#app {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px))
           calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px));
}
.boot { margin: auto; font: 800 1.4rem var(--font-display); color: var(--fg-soft); }
.screen { flex: 1; min-height: 0; display: grid; gap: 14px; }

/* ---------- top bar & wooden knobs ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 56px; }
.knob, .knob-space { flex: none; width: 52px; height: 52px; }
.knob {
  position: relative; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 34% 28%, var(--wood-hi), var(--wood) 62%);
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.08), 0 5px 0 var(--wood-side), 0 9px 14px var(--shadow);
  transition: transform .12s, box-shadow .12s;
}
.knob .ico { width: 30px; height: 30px; }
.knob.gear { opacity: .78; }
.knob.holding, .knob.down { transform: translateY(4px); box-shadow: 0 1px 0 var(--wood-side), 0 3px 6px var(--shadow); }
.ring { position: absolute; inset: -6px; width: 64px; height: 64px; transform: rotate(-90deg); pointer-events: none; }
.ring circle { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 183; stroke-dashoffset: 183; opacity: 0; }
.knob.holding .ring circle { opacity: 1; stroke-dashoffset: 0; transition: stroke-dashoffset var(--hold, 2s) linear; }
.knob.nudge::after {
  content: "Hold"; position: absolute; top: calc(100% + 10px); left: 50%; transform: translateX(-50%);
  font: 800 .85rem var(--font-display); color: var(--cream); background: var(--fg); padding: 4px 10px; border-radius: 99px;
  animation: fade-in .2s; z-index: 3; white-space: nowrap;
}
.home .knob.gear.nudge::after { left: auto; right: 0; transform: none; }

.brand { margin: 0; font: 800 clamp(1.5rem, 6.6vw, 2.2rem)/1 var(--font-display); letter-spacing: .01em; text-wrap: balance; text-align: center; }
.brand i { font-style: normal; color: var(--do); }

/* ---------- home: the toy shelf ---------- */
.home { grid-template-rows: auto minmax(0, 1fr) auto; }
.shelf { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 14px 14px; min-height: 0; padding-bottom: 6px; }
.toy { filter: var(--toy-filter); }
.tile {
  --side: color-mix(in oklab, var(--tile) 70%, #5A3A20);
  position: relative; min-height: 0; border-radius: 26px; background: var(--tile);
  display: flex; flex-direction: column; align-items: center; padding: 8px 8px 10px;
  box-shadow: inset 0 3px 0 rgba(255,255,255,.5), inset 0 -4px 0 rgba(0,0,0,.05), 0 7px 0 var(--side), 0 12px 18px var(--shadow);
  transition: transform .12s, box-shadow .12s;
}
.tile .pic { flex: 1; min-height: 0; width: 100%; display: grid; place-items: center; }
.tile .pic svg { height: 100%; width: 100%; max-height: 100%; }
.tile .cap { font: 800 clamp(.82rem, 3.6vw, 1rem)/1.1 var(--font-display); color: var(--ink); opacity: .78; white-space: nowrap; }
.tile.down, .tile.chosen { transform: translateY(5px); box-shadow: inset 0 3px 0 rgba(255,255,255,.5), 0 2px 0 var(--side), 0 4px 8px var(--shadow); }
.tile.chosen .pic svg { animation: hop .45s ease-out; }
.ios-hint { margin: 0; text-align: center; font: 600 .8rem/1.3 var(--font-body); color: var(--fg-soft); }

/* ---------- game screen ---------- */
.game { grid-template-rows: 56px auto minmax(0, 1fr); grid-template-areas: "top" "listen" "stage"; }
.game .top { grid-area: top; }
.game.free { grid-template-rows: 56px minmax(0, 1fr); grid-template-areas: "top" "stage"; }
.game.free .listen-wrap { display: none; }
.msg {
  flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: .3em;
  font: 800 clamp(1.35rem, 6vw, 1.95rem)/1 var(--font-display); white-space: nowrap; overflow: hidden;
}
.msg.hush { color: var(--fg-soft); }
.msg.yay span { animation: pop .45s ease-out; }
.msg .star { width: 1.25em; height: 1.25em; flex: none; animation: spin-in .6s ease-out; }
.listen-wrap { grid-area: listen; display: grid; place-items: center; }
.listen {
  width: clamp(92px, 17dvh, 150px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 34% 28%, var(--wood-hi), var(--wood) 64%);
  box-shadow: inset 0 -5px 0 rgba(0,0,0,.08), 0 8px 0 var(--wood-side), 0 15px 22px var(--shadow);
  transition: transform .12s, box-shadow .12s;
}
.listen .spk { width: 60%; height: 60%; }
.listen .spk .k { stroke-width: 4.5; }
.listen.down { transform: translateY(6px); box-shadow: 0 2px 0 var(--wood-side), 0 5px 10px var(--shadow); }
body[data-phase="ready"] .listen { animation: breathe 2.6s ease-in-out infinite; }
body[data-phase="question"] .listen .w { animation: wave 1.1s ease-in-out infinite; }
body[data-phase="question"] .listen .w2 { animation-delay: .18s; }
body[data-retry="1"] .listen .w { opacity: .25; }
.stage { grid-area: stage; min-height: 0; display: grid; }
.stage > * { min-height: 0; }
body[data-phase="ready"] .stage, body[data-phase="question"] .stage { filter: saturate(.86); }
.stage { transition: filter .3s; }

/* ---------- xylophone ---------- */
.xylo { display: flex; flex-direction: column; justify-content: center; height: 100%; padding-bottom: 8px; box-sizing: border-box; }
.frame { position: relative; display: flex; flex-direction: column; gap: clamp(8px, 1.6dvh, 14px); height: min(100%, calc(var(--n) * 148px)); }
.rails { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.rails line { stroke: var(--wood-side); stroke-width: 15px; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.rails.rl { display: none; }
.row { position: relative; z-index: 1; flex: 1; min-height: 0; display: flex; justify-content: center; }
.bar {
  --side: color-mix(in oklab, var(--c) 62%, #3B2412);
  width: calc(100% - var(--i) * 4.5%); box-sizing: border-box; border-radius: 18px;
  display: flex; align-items: center; justify-content: space-between; padding-inline: 4%;
  background: linear-gradient(180deg, color-mix(in oklab, var(--c) 72%, white) 0%, var(--c) 42%, color-mix(in oklab, var(--c) 88%, black) 100%);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.35), 0 6px 0 var(--side), 0 10px 14px var(--shadow);
  transition: transform .1s, box-shadow .1s; filter: var(--toy-filter);
}
.bar b {
  font: 800 clamp(1.15rem, min(7vw, 4.6dvh), 2.3rem)/1 var(--font-display); color: var(--ink);
  background: var(--cream); padding: .16em .62em .22em; border-radius: 99px; box-shadow: inset 0 -2px 0 rgba(0,0,0,.08);
}
.peg { width: 13px; height: 13px; border-radius: 50%; flex: none; background: radial-gradient(circle at 35% 35%, #FFFFFF, #CBBFB2); box-shadow: 0 1px 0 rgba(0,0,0,.3); }
.row.down .bar, .row.lit .bar { transform: translateY(5px); box-shadow: inset 0 2px 0 rgba(255,255,255,.35), 0 1px 0 var(--side), 0 3px 6px var(--shadow); }
.row.lit .bar { filter: brightness(1.12) saturate(1.1); box-shadow: 0 0 0 6px color-mix(in oklab, var(--c) 35%, transparent), 0 1px 0 var(--side); }
.row.glow .bar { animation: glow 1.8s ease-in-out infinite; }
.row.oops .bar { animation: wiggle .5s ease-in-out; }
.row.yay .bar { animation: bounce .55s ease-out; }
.echo { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; }
.beads { display: flex; justify-content: center; gap: 12px; height: 20px; }
.bead { width: 18px; height: 18px; border-radius: 50%; background: var(--wall-dot); box-shadow: inset 0 2px 3px rgba(0,0,0,.18); transition: transform .2s; }
.bead.on { background: var(--cb); transform: scale(1.18); box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); }

/* ---------- two-picture games ---------- */
.duo { display: grid; grid-template-rows: 1fr 1fr; gap: 16px; padding-bottom: 8px; }
.pick {
  --side: color-mix(in oklab, var(--pc) 70%, #5A3A20);
  position: relative; min-height: 0; overflow: hidden; border-radius: 28px; background: var(--pc);
  display: grid; place-items: center;
  box-shadow: inset 0 3px 0 rgba(255,255,255,.45), 0 7px 0 var(--side), 0 12px 18px var(--shadow);
  transition: transform .12s, box-shadow .12s;
}
.pick .art { height: 86%; width: 92%; position: relative; z-index: 1; }
.pick.down { transform: translateY(5px); box-shadow: inset 0 3px 0 rgba(255,255,255,.45), 0 2px 0 var(--side), 0 4px 8px var(--shadow); }
.pick.oops { animation: wiggle .5s ease-in-out; }
.pick.yay .art { animation: hop .7s ease-out; }
.pick.glow { animation: glow-pick 1.8s ease-in-out infinite; }
.duo-twins .p0 { --pc: var(--t-twins); } .duo-twins .p1 { --pc: #CDE9D9; }
.duo-stairs .p0 { --pc: var(--t-stairs); } .duo-stairs .p1 { --pc: #F6DCC4; }
.duo-tempo .p0 { --pc: #D7EBC3; } .duo-tempo .p1 { --pc: var(--t-tempo); }
.duo-loud .p0 { --pc: var(--t-echo); } .duo-loud .p1 { --pc: var(--t-loud); }
.duo-birdfish { gap: 0; border-radius: 28px; box-shadow: 0 10px 18px var(--shadow); }
.duo-birdfish .pick { border-radius: 28px 28px 0 0; box-shadow: none; background: linear-gradient(var(--sky-1), var(--sky-2)); }
.duo-birdfish .p1 { border-radius: 0 0 28px 28px; background: linear-gradient(var(--sea-1), var(--sea-2)); }
.duo-birdfish .p0::before { content: ""; position: absolute; width: 64px; height: 64px; right: 10%; top: 12%; border-radius: 50%; background: radial-gradient(circle, #FFE58A 55%, rgba(255,229,138,0) 72%); }
.duo-birdfish .p0::after { content: ""; position: absolute; width: 90px; height: 30px; left: 9%; top: 20%; border-radius: 30px; background: rgba(255,255,255,.85); box-shadow: 26px -12px 0 -2px rgba(255,255,255,.85); }
.duo-birdfish .p1::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 18px; background: radial-gradient(circle at 50% 0, var(--sky-2) 11px, transparent 12px) 0 0 / 34px 18px repeat-x; }
.duo-birdfish .pick.down { transform: none; filter: brightness(.94); }
.duo-birdfish .pick.down .art { transform: scale(.95); }
.duo-birdfish .p1 .art { height: 80%; }
.duo-birdfish .wing { transform-origin: 54px 62px; animation: flap 2.4s ease-in-out infinite; }
.duo-birdfish .fish { animation: swim 3.2s ease-in-out infinite; }
.duo-birdfish .yay .wing { animation-duration: .3s; }
.walk { transition: none; }
.yay .walk.up { animation: climb-up 1s ease-in-out forwards; }
.yay .walk.down { animation: climb-down 1s ease-in-out forwards; }
.duo-stairs .pick.yay .art { animation: none; }

/* ---------- help: shown, lit, dimmed ---------- */
.stage [data-t] { transition: opacity .25s, filter .25s; }
.stage.focus [data-t]:not(.keep):not(.bear-wrap) { opacity: .38; filter: saturate(.35); }
.row.poke .bar, .pick.poke .art { animation: poke .45s ease-out; }
.pick.lit { transform: translateY(-4px) scale(1.02); box-shadow: inset 0 3px 0 rgba(255,255,255,.45), 0 0 0 7px color-mix(in oklab, var(--accent) 40%, transparent), 0 11px 0 var(--side), 0 16px 22px var(--shadow); }
.pick.lit .art { animation: hop .45s ease-out; }
.duo-birdfish .pick.lit { box-shadow: inset 0 0 0 7px color-mix(in oklab, #FFF8EC 70%, transparent); transform: none; }

/* ---------- who's singing ---------- */
.who.n3, .who.n4 { grid-template-rows: 1fr 1fr; grid-template-columns: 1fr 1fr; }
.who.n3 .pick:first-child { grid-column: 1 / -1; }
.who .w0 { --pc: #FBE7A1; } .who .w1 { --pc: #FFE1CC; } .who .w2 { --pc: #D6EAF7; } .who .w3 { --pc: #D7EBC3; }

/* ---------- drum along ---------- */
.drumming { display: grid; grid-template-rows: auto minmax(0, 1fr) minmax(0, 1.25fr); gap: 10px; padding-bottom: 8px; }
.drumming .beads { flex-wrap: wrap; height: auto; min-height: 20px; }
.bear-wrap { display: grid; place-items: center; min-height: 0; }
.bear-wrap .art { height: 100%; max-height: 220px; width: auto; }
.bear-wrap .paw { transform-origin: 30px 80px; transition: transform .08s; }
.bear-wrap .p2 { transform-origin: 90px 80px; }
.bear-wrap.lit .paw { transform: rotate(14deg); } .bear-wrap.lit .p2 { transform: rotate(-14deg); }
.pad { --pc: #FBE3C8; }
.pad .art { height: 92%; }
.pad.hit .art { transform: scale(.94, .9); transition: transform .05s; }

/* ---------- celebration ---------- */
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
.spark {
  position: absolute; width: 20px; height: 20px; background: var(--c);
  clip-path: polygon(50% 0, 62% 36%, 100% 38%, 69% 60%, 80% 100%, 50% 76%, 20% 100%, 31% 60%, 0 38%, 38% 36%);
  animation: spark .95s ease-out forwards;
}
.fly { position: absolute; width: 28px; height: 36px; animation: fly 1.3s ease-out forwards; }
.fly svg { width: 100%; height: 100%; }
#toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translate(-50%, 30px);
  background: var(--fg); color: var(--wall); font: 700 .95rem var(--font-body); padding: 10px 18px; border-radius: 99px;
  opacity: 0; transition: opacity .25s, transform .25s; z-index: 20; pointer-events: none; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- adult sheet ---------- */
#sheet { position: fixed; inset: 0; z-index: 10; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: min(560px, 100%); max-height: 92dvh; box-sizing: border-box; display: flex; flex-direction: column;
  background: var(--sheet); color: var(--sheet-fg); border-radius: 24px 24px 0 0;
  padding: 16px max(18px, env(safe-area-inset-left, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px);
  box-shadow: 0 -10px 30px var(--shadow); font: 600 1rem/1.4 var(--font-body); animation: rise .25s ease-out;
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.sheet h2 { margin: 0; font: 800 1.5rem var(--font-display); }
.sheet .done { font: 800 1rem var(--font-body); background: var(--accent); color: var(--sheet); padding: 9px 18px; border-radius: 99px; touch-action: manipulation; }
.sheet-scroll { overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain; display: grid; gap: 20px; padding: 14px 2px 8px; -webkit-overflow-scrolling: touch; }
.sheet-scroll * { touch-action: pan-y; }
.sheet section { display: grid; gap: 12px; }
.sheet h3 { margin: 0; font: 800 .78rem var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-soft); }
.sheet h4 { margin: 0 0 6px; font: 800 1rem var(--font-body); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.ages { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.ages .chips { display: contents; }
.chip.age { font: 800 1.6rem var(--font-display); padding: 14px 0; border-radius: 18px; }
.blurb { margin: 0; color: var(--fg-soft); font-size: .92rem; }
.more, .gm-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left; font: 800 1.05rem var(--font-body); background: var(--chip); padding: 14px 16px; border-radius: 16px; touch-action: pan-y; }
.more small { display: block; font: 600 .85rem var(--font-body); color: var(--fg-soft); }
.more .hint-line { display: block; font: 700 .8rem var(--font-body); color: var(--accent); }
.more i, .gm-head i { font-style: normal; font-size: 1.4rem; color: var(--fg-soft); transition: transform .2s; }
.gm { display: grid; gap: 0; }
.gm + .gm { margin-top: 8px; }
.gm-head { font-size: 1rem; padding: 12px 14px; }
.gm-head span { flex: 1; }
.gm-head em { display: block; font: 600 .78rem var(--font-body); font-style: normal; color: var(--fg-soft); }
.gm.open .gm-head { border-radius: 16px 16px 0 0; }
.gm.open .gm-head i { transform: rotate(90deg); }
.gm-body { display: grid; gap: 12px; padding: 12px 14px 14px; border: 2px solid var(--chip); border-top: 0; border-radius: 0 0 16px 16px; }
.badge { font: 800 .72rem var(--font-body); padding: 3px 8px; border-radius: 99px; background: var(--accent); color: var(--sheet); white-space: nowrap; }
.badge.soft { background: transparent; color: var(--fg-soft); border: 1px solid var(--line); }
.row-set h5 { margin: 0 0 6px; font: 700 .85rem var(--font-body); color: var(--fg-soft); }
.row-set .chip { padding: 6px 11px; font-size: .85rem; }
.back { font: 800 1rem var(--font-body); color: var(--accent); padding: 8px 4px; touch-action: manipulation; }
.chip { background: var(--chip); padding: 8px 14px; border-radius: 99px; font: 700 .92rem var(--font-body); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--sheet); }
.gm-body .tog { font-size: .92rem; }
.tog { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0; text-align: left; font: 700 1rem var(--font-body); }
.tog i { flex: none; width: 50px; height: 30px; border-radius: 99px; background: var(--chip); position: relative; transition: background .2s; }
.tog i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--sheet); box-shadow: 0 1px 3px var(--shadow); transition: transform .2s; }
.tog[aria-checked="true"] i { background: var(--accent); }
.tog[aria-checked="true"] i::after { transform: translateX(20px); }
.slider { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) 3.4em; align-items: center; gap: 10px; font-weight: 700; }
.slider input { width: 100%; accent-color: var(--accent); }
.slider output { text-align: right; font-variant-numeric: tabular-nums; color: var(--fg-soft); }
.fine p { margin: 0; color: var(--fg-soft); font-size: .9rem; max-width: 60ch; }
.reset { justify-self: start; font: 700 .95rem var(--font-body); color: var(--do); padding: 6px 0; }

/* ---------- landscape ---------- */
@media (orientation: landscape) {
  .shelf { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px 12px; }
  .home { gap: 10px; }
  .game { grid-template-columns: auto minmax(0, 1fr); grid-template-rows: 52px minmax(0, 1fr); grid-template-areas: "top top" "listen stage"; gap: 10px 18px; }
  .game.free { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "stage"; }
  .top { height: 52px; }
  .listen { width: clamp(92px, 34dvh, 170px); }
  .listen-wrap { padding-inline: 4px; }
  .xylo { flex-direction: row; }
  .frame { flex-direction: row; height: 100%; width: min(100%, calc(var(--n) * 118px)); }
  .rails.rp { display: none; } .rails.rl { display: block; }
  .row { flex-direction: column; justify-content: center; }
  .bar { width: auto; height: calc(100% - var(--i) * 4.5%); flex-direction: column; padding: 4% 0; }
  .bar b { padding: .5em .3em; font-size: clamp(1rem, min(4.2vw, 7dvh), 2rem); }
  .duo:not(.duo-birdfish) { grid-template-rows: none; grid-template-columns: 1fr 1fr; }
  .who.n3, .who.n4 { grid-template-rows: none; grid-template-columns: repeat(var(--cols, 4), 1fr); }
  .who.n3 { --cols: 3; } .who.n3 .pick:first-child { grid-column: auto; }
  .drumming { grid-template-rows: auto minmax(0, 1fr); grid-template-columns: 1fr 1.3fr; }
  .drumming .beads { grid-column: 1 / -1; }
  .tile .cap { font-size: .85rem; }
}

@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }
@keyframes wave { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes wiggle { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
@keyframes bounce { 0% { transform: translateY(5px); } 45% { transform: translateY(-7px) scale(1.02); } 100% { transform: translateY(0); } }
@keyframes hop { 0%, 100% { transform: translateY(0); } 35% { transform: translateY(-9%) scale(1.04, .97); } 65% { transform: translateY(1%) scale(.98, 1.02); } }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
@keyframes spin-in { from { transform: rotate(-90deg) scale(.3); } to { transform: none; } }
@keyframes spark { from { transform: translate(-50%, -50%) scale(.4); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(80deg); opacity: 0; } }
@keyframes fly { from { transform: translate(-50%, -50%); opacity: 1; } to { transform: translate(-50%, -150px) rotate(-14deg); opacity: 0; } }
@keyframes glow { 0%, 100% { box-shadow: 0 6px 0 var(--side), 0 0 0 0 color-mix(in oklab, var(--c) 0%, transparent); } 50% { box-shadow: 0 6px 0 var(--side), 0 0 0 8px color-mix(in oklab, var(--c) 40%, transparent); } }
@keyframes glow-pick { 0%, 100% { outline: 0 solid transparent; } 50% { outline: 7px solid color-mix(in oklab, var(--accent) 45%, transparent); } }
@keyframes flap { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-14deg); } }
@keyframes swim { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-4px, 3px); } }
@keyframes climb-up { 25% { transform: translate(25px, -18px); } 50% { transform: translate(50px, -36px); } 75%, 100% { transform: translate(75px, -54px); } }
@keyframes climb-down { 25% { transform: translate(25px, 18px); } 50% { transform: translate(50px, 36px); } 75%, 100% { transform: translate(75px, 54px); } }
@keyframes poke { 0%, 100% { transform: none; } 40% { transform: translateY(-4px) scale(1.02); } }
@keyframes rise { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
